 ['llm','token','읽고 쓰는 단위'],['llm','context','참고할 자료'],['llm','prompt','요청 전달'],['llm','model','작업 수행'],['prompt','context','맥락 전달'],
 ['claude','chat','Claude 사용 방식'],['claude','cowork','Claude 사용 방식'],['claude','vscode','함께 작업'],['claude','gemini','수업의 두 도구'],['gemini','canvas','게임 제작 화면'],['canvas','html','게임 파일'],
 ['interview','ia','화면 정리'],['interview','prd','조건 정리'],['interview','grill','질문 도우미'],['ia','prd','흐름에서 조건으로'],['prd','approval','읽고 확정'],['plan','approval','계획 확인'],['approval','phase','작게 구현'],['phase','feedback','확인 후 수정'],['feedback','qa','차이 확인'],
 ['html','css','모양 정하기'],['html','js','동작 만들기'],['html','component','화면 요소'],['js','storage','기록 보관'],['js','permission','기기 기능 사용'],['html','localhost','내 PC에서 실행'],['localhost','tunnel','외부에서 확인'],['prd','storage','저장 조건'],

 ['qa','playwright','반복 검사'],['qa','source','숫자 확인'],['qa','prd','기획과 비교'],['qa','security','공유 전 확인'],['security','apikey','비밀 값 보호'],['security','deploy','공개 범위 확인'],['git','deploy','변경 후 공유'],['deploy','user','써 본 반응'],['user','interview','다음 문제 정리']

const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
const nodes=rows.map(([id,label,group,description,slide,aliases])=>({id,label,group,description,slide,aliases,labelWidth:[...label].reduce((w,c)=>w+(/[ -~]/.test(c)?13:25),0)}));
const byId=new Map(nodes.map(n=>[n.id,n])),groupMap=new Map(groups.map(g=>[g[0],{label:g[1],color:g[2]}]));
const hubs=['llm','claude','interview','html','api','skill','qa'];
let category='all',query='',selected=null,mode='graph',visible=new Set(nodes.map(n=>n.id)),camera={x:0,y:0,s:1},gesture=null;
const nodeEls=new Map(),edgeEls=[];
function svgElement(name,attributes){const e=document.createElementNS(ns,name);for(const [k,v] of Object.entries(attributes))e.setAttribute(k,v);return e;}
function positionNodes(){
 const anchors=[[-430,-280],[0,-390],[430,-275],[465,135],[240,380],[-265,370],[-510,90]];
 groups.forEach(([id],i)=>{const subset=nodes.filter(n=>n.group===id&&n.id!=='vibe');subset.forEach((n,j)=>{const a=anchors[i];n.ax=a[0];n.ay=a[1];n.hub=hubs.includes(n.id);const t=j*2.399+i*.6,r=n.hub?0:70+28*Math.sqrt(j);n.x=a[0]+Math.cos(t)*r;n.y=a[1]+Math.sin(t)*r;});});
 Object.assign(byId.get('vibe'),{x:0,y:0,ax:0,ay:0,hub:true});
 // Keep each label readable, rather than letting force-layout nodes overlap.
 for(let step=0;step<320;step++){
  for(const n of nodes){if(n.id==='vibe')continue;n.x+=(n.ax-n.x)*.012;n.y+=(n.ay-n.y)*.012;}
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
   const a=nodes[i],b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,needX=(a.labelWidth+b.labelWidth)/2+20,overX=needX-Math.abs(dx),overY=64-Math.abs(dy);
   if(overX>0&&overY>0){if(overX<overY){const force=(overX+2)*.29*(dx>=0?1:-1);if(a.id!=='vibe')a.x-=force;if(b.id!=='vibe')b.x+=force;}else{const force=(overY+2)*.29*(dy>=0?1:-1);if(a.id!=='vibe')a.y-=force;if(b.id!=='vibe')b.y+=force;}}
  }
 }
}
positionNodes();
for(const [a,b,relation] of links){const e=svgElement('line',{class:'edge',x1:byId.get(a).x,y1:byId.get(a).y,x2:byId.get(b).x,y2:byId.get(b).y});$('edges').append(e);edgeEls.push({e,a,b,relation});}
for(const n of nodes){
 const e=svgElement('g',{class:'node'+(n.hub?' hub':'')+(n.id==='vibe'?' root':''),transform:`translate(${n.x} ${n.y})`,role:'button',tabindex:0,'aria-label':n.label+'：'+n.description,'aria-pressed':'false','data-id':n.id});e.style.setProperty('--color',groupMap.get(n.group).color);
 e.append(svgElement('rect',{x:-n.labelWidth/2-8,y:-19,width:n.labelWidth+16,height:64,fill:'transparent'}),svgElement('circle',{r:n.hub?11:7}),svgElement('circle',{class:'ring',r:n.hub?19:15}));const text=svgElement('text',{y:36});text.textContent=n.label;e.append(text);
 e.addEventListener('click',()=>{if(!gesture?.moved)selectNode(n.id)});e.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectNode(n.id)}});
 $('nodes').append(e);nodeEls.set(n.id,e);
}
function applyCamera(){$('scene').setAttribute('transform',`translate(${camera.x} ${camera.y}) scale(${camera.s})`);}
function fitGraph(){
 if(!visible.size)return;const box=$('graph').getBoundingClientRect();
 const active=nodes.filter(n=>visible.has(n.id)),xmin=Math.min(...active.map(n=>n.x-n.labelWidth/2-15)),xmax=Math.max(...active.map(n=>n.x+n.labelWidth/2+15)),ymin=Math.min(...active.map(n=>n.y-25)),ymax=Math.max(...active.map(n=>n.y+54));
 camera.s=Math.min((box.width-50)/Math.max(240,xmax-xmin),(box.height-80)/Math.max(170,ymax-ymin),1.2);camera.x=box.width/2-(xmin+xmax)/2*camera.s;camera.y=box.height/2-(ymin+ymax)/2*camera.s;applyCamera();
}
function zoom(factor,cx,cy){const box=$('graph').getBoundingClientRect();cx??=box.width/2;cy??=box.height/2;const s=Math.max(.15,Math.min(2.5,camera.s*factor));camera.x=cx-(cx-camera.x)*s/camera.s;camera.y=cy-(cy-camera.y)*s/camera.s;camera.s=s;applyCamera();}
function relatedNodes(id){return links.filter(([a,b])=>a===id||b===id).map(([a,b,r])=>({node:byId.get(a===id?b:a),relation:r}));}
function button(text,action){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=action;return b;}
function renderDetail(){
 const d=$('detail');d.replaceChildren();const eye=document.createElement('span');eye.className='eyebrow';eye.textContent=selected?groupMap.get(byId.get(selected).group).label:'한 단어부터 시작하세요';d.append(eye);
 const h=document.createElement('h2');h.textContent=selected?byId.get(selected).label:'오늘의 개념, 한눈에';d.append(h);
 const p=document.createElement('p');p.className='definition';p.textContent=selected?byId.get(selected).description:'서로 이어진 단어를 따라가며 복습해 보세요. 개념을 누르면 뜻과 관련 개념, 해당 교안이 나옵니다.';d.append(p);
 const title=document.createElement('h3');title.textContent=selected?'이어지는 개념':'이렇게 시작해 보세요';d.append(title);
 const container=document.createElement('div');container.className=selected?'related':'start';
 if(selected)for(const {node,relation} of relatedNodes(selected)){const b=button('',()=>selectNode(node.id,true));const label=document.createElement('span');label.textContent=node.label;const r=document.createElement('span');r.className='relation';r.textContent=relation;b.append(label,r);container.append(b);}
 else for(const id of ['ia','context','api','qa'])container.append(button(byId.get(id).label,()=>selectNode(id,true)));d.append(container);
 if(selected){const a=document.createElement('a');a.className='lesson';a.href='slides.html#'+byId.get(selected).slide;a.target='_blank';a.rel='noopener';a.textContent='교안 '+byId.get(selected).slide+'장 · 다시 보기 ↗';d.append(a);d.append(button('전체 연결로 돌아가기',resetSelection));d.lastElementChild.className='reset';}
}
function highlight(){
 const neighbors=new Set(selected?[selected,...relatedNodes(selected).map(x=>x.node.id)]:[]);
 for(const n of nodes){const e=nodeEls.get(n.id);e.classList.toggle('selected',selected===n.id);e.classList.toggle('dim',!!selected&&!neighbors.has(n.id));e.setAttribute('aria-pressed',String(n.id===selected));}
 for(const {e,a,b} of edgeEls){e.classList.toggle('active',!!selected&&(a===selected||b===selected));e.classList.toggle('dim',!!selected&&a!==selected&&b!==selected);}
}
function selectNode(id,reveal=false){
 if(!byId.has(id))return;if(reveal&&!visible.has(id)){category='all';query='';$('search').value='';filterNodes();}
 selected=id;history.replaceState(null,'','#'+id);highlight();renderDetail();renderList();
 if(innerWidth<=720)$('detail').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'start'});
}
function resetSelection(){selected=null;history.replaceState(null,'',location.pathname+location.search);highlight();renderDetail();renderList();}
function renderFilters(){const f=$('filters');f.replaceChildren();for(const [id,label,color] of [['all','전체',null],...groups]){const b=button(id==='all'?'전체':label,()=>{category=id;resetSelection();filterNodes();fitGraph()});b.className='filter';b.dataset.group=id;b.setAttribute('aria-pressed',String(category===id));if(color){const dot=document.createElement('span');dot.className='dot';dot.style.setProperty('--color',color);b.prepend(dot)}f.append(b);}}
function renderList(){const list=$('list');list.replaceChildren();for(const n of nodes.filter(n=>visible.has(n.id))){const b=button('',()=>selectNode(n.id));b.dataset.id=n.id;b.setAttribute('aria-pressed',String(selected===n.id));const tag=document.createElement('small');tag.textContent=groupMap.get(n.group).label;const name=document.createElement('strong');name.textContent=n.label;const p=document.createElement('p');p.textContent=n.description;b.append(tag,name,p);list.append(b);}}
function filterNodes(){
 const q=query.trim().toLocaleLowerCase();visible=new Set(nodes.filter(n=>(category==='all'||n.group===category)&&(!q||(n.label+' '+n.aliases+' '+n.description).toLocaleLowerCase().includes(q))).map(n=>n.id));
 for(const [id,e] of nodeEls){const show=visible.has(id);e.classList.toggle('hidden',!show);e.setAttribute('tabindex',show?'0':'-1');e.setAttribute('aria-hidden',String(!show));}
 for(const {e,a,b} of edgeEls)e.classList.toggle('hidden',!visible.has(a)||!visible.has(b));
 $('count').textContent=visible.size+' / '+nodes.length+'개 개념';$('empty').hidden=visible.size>0;$('clearSearch').hidden=!query;
 renderFilters();renderList();const hits=$('searchHits');hits.replaceChildren();hits.hidden=!q||!visible.size;if(q)for(const n of nodes.filter(n=>visible.has(n.id)))hits.append(button(n.label,()=>selectNode(n.id)));
 if(selected&&!visible.has(selected))resetSelection();highlight();
}
function setMode(next){mode=next;$('list').hidden=mode!=='list';$('graph').toggleAttribute('hidden',mode!=='graph');$('graphTools').hidden=mode!=='graph';$('hint').hidden=mode!=='graph';$('graphMode').setAttribute('aria-pressed',String(mode==='graph'));$('listMode').setAttribute('aria-pressed',String(mode==='list'));if(mode==='graph')fitGraph();}
$('search').addEventListener('input',()=>{query=$('search').value;filterNodes();fitGraph()});$('clearSearch').onclick=()=>{query='';$('search').value='';filterNodes();fitGraph();$('search').focus()};$('graphMode').onclick=()=>setMode('graph');$('listMode').onclick=()=>setMode('list');$('zoomIn').onclick=()=>zoom(1.25);$('zoomOut').onclick=()=>zoom(.8);$('fit').onclick=fitGraph;
$('graph').addEventListener('wheel',e=>{e.preventDefault();const r=$('graph').getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('graph').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node'))return;gesture={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};$('graph').setPointerCapture(e.pointerId);$('graph').classList.add('dragging')});
$('graph').addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.abs(dx)+Math.abs(dy)>1)gesture.moved=true;camera.x+=dx;camera.y+=dy;gesture.x=e.clientX;gesture.y=e.clientY;applyCamera()});
function stopDrag(){if(!gesture)return;$('graph').classList.remove('dragging');const moved=gesture.moved;gesture=null;if(!moved)resetSelection();}
$('graph').addEventListener('pointerup',stopDrag);$('graph').addEventListener('pointercancel',()=>{gesture=null;$('graph').classList.remove('dragging')});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(fitGraph,100)});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId.has(id))selectNode(id,true);else resetSelection()});
filterNodes();renderDetail();const initial=location.hash.slice(1);if(byId.has(initial))selectNode(initial,true);
if(innerWidth<=720)$('hint').textContent='작으면 분야를 고르거나 ＋로 확대하세요. 목록으로도 볼 수 있어요.';
document.fonts.ready.then(fitGraph);
